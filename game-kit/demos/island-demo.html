<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Island demo: sky, ocean, cloned animated characters</title></head><body style="margin:0;overflow:hidden">
<!-- Shows: Sky + Water (three r128 add-ons), one character file cloned into 3 players with different animations (SkeletonUtils), CC0 trees and a bike. -->
<!-- Same three.js version the arcade uses (r128). Open through a web server (Cloudflare, GitHub Pages), not as a local file. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="../vendor/three-r128-addons/SkeletonUtils.js"></script><script src="../vendor/three-r128-addons/Sky.js"></script><script src="../vendor/three-r128-addons/Water.js"></script>
<script>
const W=innerWidth,H=innerHeight,r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=.6;document.body.appendChild(r.domElement);
const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,W/H,.1,20000);cam.position.set(0,3.2,9);cam.lookAt(0,1,0);
const sky=new THREE.Sky();sky.scale.setScalar(10000);s.add(sky);const sun=new THREE.Vector3().setFromSphericalCoords(1,THREE.MathUtils.degToRad(84),THREE.MathUtils.degToRad(160));sky.material.uniforms.sunPosition.value.copy(sun);
const water=new THREE.Water(new THREE.PlaneGeometry(10000,10000),{textureWidth:512,textureHeight:512,waterNormals:new THREE.TextureLoader().load('../vendor/three-r128-addons/waternormals.jpg',t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping}),sunDirection:sun.clone(),sunColor:0xffffff,waterColor:0x00506e,distortionScale:3.7});water.rotation.x=-Math.PI/2;s.add(water);
s.add(new THREE.HemisphereLight(0xffffff,0x334455,1.2));const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.copy(sun).multiplyScalar(50);s.add(d);
const isl=new THREE.Mesh(new THREE.CylinderGeometry(6,7,1,40),new THREE.MeshStandardMaterial({color:0xe7cf8f}));isl.position.y=-.3;s.add(isl);
const L=new THREE.GLTFLoader();const R={};const mixers=[];
(async()=>{const sol=await L.loadAsync('../models/arena/character-soldier.glb');
 const names=['walk','emote-yes','attack-melee-right'];[-2.2,0,2.2].forEach((x,i)=>{const c=THREE.SkeletonUtils.clone(sol.scene);c.scale.setScalar(1.6);c.position.set(x,.2,0);c.rotation.y=.3-i*.3;s.add(c);
  const m=new THREE.AnimationMixer(c);m.clipAction(THREE.AnimationClip.findByName(sol.animations,names[i])).play();mixers.push(m);});
 const tree=(await L.loadAsync('../models/city/grass-trees-tall.glb')).scene;[[-4.2,-2.2],[4.4,-1.8],[3.6,-3.6]].forEach(([x,z])=>{const t=tree.clone();t.scale.setScalar(2.4);t.position.set(x,.2,z);s.add(t);});
 const bike=(await L.loadAsync('../models/racing/vehicle-motorcycle.glb')).scene;bike.scale.setScalar(1.3);bike.position.set(-3.6,.2,2.2);bike.rotation.y=.9;s.add(bike);
 const clock=new THREE.Clock();(function loop(){const dt=clock.getDelta();mixers.forEach(m=>m.update(dt));water.material.uniforms.time.value+=dt;r.render(s,cam);requestAnimationFrame(loop);})();
 R.clones=mixers.length;R.ok=true;window.R=R;window.DONE=true;})().catch(e=>{window.R={err:String(e)};window.DONE=true;});
</script></body></html>
